name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project ZIP
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет .zip файла"; exit 1; fi
          echo "Распаковываю: $ZIP"
          mkdir -p work
          unzip -q -o "$ZIP" -d work
          ROOT=$(dirname "$(find work -name settings.gradle.kts | head -n 1)")
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then echo "settings.gradle.kts не найден в архиве"; exit 1; fi
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Проект: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: LyfeStyleMusic-2.0-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LyfeStyleMusic-2.0-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
